services:
  postgres:
    image: postgres:17

    container_name: backend-db

    restart: always

    environment:
      POSTGRES_USER: postgres2
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: weekly

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres2 -d weekly"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
